{% load static %}
{% load shop_tags %}
{% main_categories as list_cats %}

<div class="nav__header">
  <div class="container">
    <div class="nav_info">
      <div class="nav_left">
        <div class="languege">
          <select name="lang" class="filter_lang">
            <option value="ru">Ру</option>
            <option value="en">En</option>
          </select>
        </div>
        <div class="city">
          <select name="city" class="filter_city">
            <option value="tashkent">Ташкент</option>
            <option value="samarkand">Самарканд</option>
          </select>
        </div>
      </div>
      <div class="nav_right">
        {% if request.user.is_authenticated %}
        <a href="{% url 'profile' %}">Профиль</a>
        <a href="{% url 'logout' %}">Выход</a>
        {% else %}
        <a href="{% url 'login' %}">Вход</a>
        <a href="{% url 'registration' %}">Регистрация</a>
        {% endif %}
      </div>
    </div>
  </div>
</div>

<nav>
  <div class="nav_menu_icon container">
    <div class="nav__top">
      <a href="{% url 'main' %}" class="logo">
        <img src="{% static 'image/logo/logo store 2.svg' %}" alt="Digitalstore">
      </a>
      <form action="{% url 'search' %}" method="get">
        <label for="s" class="label_search">
          <input id="s" type="text" name="q" value="{{ request.GET.q }}" placeholder="Поиск по товарам" class="serch_in">
          <button type="submit"><img class="icon_serch" src="{% static 'image/icons/Vector.svg' %}" alt=""></button>
        </label>
      </form>
      <div class="nav_icon">
        <ul class="icon">
          <li><a href="{% url 'favorites' %}" class="click_icon"><img src="{% static 'image/icon_header/Group 524.svg' %}" alt="Избранное"></a></li>
          <li><a href="{% url 'cart' %}" class="click_icon"><img src="{% static 'image/icon_header/bi_cart3 (1).svg' %}" alt="Корзина"></a></li>
          <li><a href="{% url 'profile' %}" class="click_icon"><img src="{% static 'image/icon_header/Group 522 (1).svg' %}" alt="Профиль"></a></li>
          <li class="dropdown">
            <a href="#!" class="category_burger"><img src="{% static 'image/icons/burger.svg' %}" alt="">
            </a>
            <div class="dropdown-content">
              <ul class="list_burger">
                {% for cat in list_cats %}
                <li class="burger_list"><a href="{{ cat.get_absolute_url }}">{% if cat.icon %}<img src="{{ cat.icon.url }}" alt="">{% endif %} <span class="burger_text">{{ cat.title }}</span></a></li>
                {% endfor %}
              </ul>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </div>
</nav>
