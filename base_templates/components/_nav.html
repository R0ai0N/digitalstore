{% load static %}
{% load shop_tags %}
{% main_categories as list_cats %}

<div class="header_nav_menu">
  <div class="container">
    <div class="nav__menu">
      <ul class="nav__category">
        <li class="dropdown">
          <a href="#!" class="category_burger"><img src="{% static 'image/icons/burger.svg' %}" alt="">
            <p class="cat_text">Каталог</p>
          </a>
          <div class="dropdown-content">
            {% for cat in list_cats %}
            <a href="{{ cat.get_absolute_url }}">{{ cat.title }}</a>
            {% endfor %}
            <a href="{% url 'sale' %}">Акции</a>
          </div>
        </li>

        {% for cat in list_cats %}
        <li><a href="{{ cat.get_absolute_url }}" class="category">{% if cat.icon %}<img src="{{ cat.icon.url }}" alt="">{% endif %}
            <p class="cat_text">{{ cat.title }}</p>
          </a></li>
        {% endfor %}
      </ul>
    </div>
  </div>
</div>
